function applyTheme(name){
  const th = THEMES[name] || THEMES.midnight;
  Object.entries(th.vars).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
  localStorage.setItem('chiffre_theme', name);
}

/* ================= Willkommensbildschirm ================= */

  const langs = [['de','Deutsch','DE'],['en','English','EN']];

    <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:22px;">
      ${brandmark(40)}
      <div style="text-align:center;max-width:420px;">
        <div style="font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:8px;">${t('welcome_title')}</div>
        <div style="color:var(--muted);font-size:14px;line-height:1.6;">${t('welcome_sub')}</div>
      </div>
      <div style="width:100%;max-width:380px;">
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px;">
          <span style="font-size:20px;">🌐</span>
          <span style="font-family:var(--font-display);font-size:17px;font-weight:600;">${t('language')} / Language</span>
        </div>
        <div id="lang-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px;">
          ${langs.map(([code,label,tag]) => `
            <button class="lang-big ${code===currentLang?'sel':''}" data-lang="${code}">
              <span class="lang-tag">${tag}</span>
              <span class="lang-name">${label}</span>
            </button>`).join('')}

        <div class="my-code-label" style="margin-bottom:8px;">${t('design')}</div>
        <div id="theme-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:26px;">
          ${Object.entries(THEMES).map(([key,th]) => `
            <button class="theme-opt" data-theme="${key}" style="padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;">
              <span style="display:inline-flex;gap:3px;">
                <span style="width:12px;height:12px;border-radius:50%;background:${th.vars['--accent']};"></span>
                <span style="width:12px;height:12px;border-radius:50%;background:${th.vars['--surface']};border:1px solid var(--line);"></span>
              </span>
              <span style="font-size:13px;">${th.name[currentLang] || th.name.de}</span>
            </button>`).join('')}
        </div>
        <button class="btn-primary" id="welcome-start" style="width:100%;padding:14px;font-size:15px;">${t('start')}</button>
      </div>
    </div>
  `;
  app.querySelectorAll('.lang-big').forEach(b => b.addEventListener('click', () => {
    currentLang = b.dataset.lang;
    localStorage.setItem('chiffre_lang', currentLang);
    renderWelcome();
  }));
  app.querySelectorAll('.theme-opt').forEach(b => {
    if (b.dataset.theme === (localStorage.getItem('chiffre_theme') || 'midnight')){
      b.style.borderColor = 'var(--accent)';
    }
    b.addEventListener('click', () => {
      applyTheme(b.dataset.theme);
      renderWelcome();
    });
  });
  document.getElementById('welcome-start').addEventListener('click', () => {
    localStorage.setItem('chiffre_onboarded', '1');
    initPeer();
    renderShell();
  });
}

  modalShell(`

      ${AVATAR_IDS.map(id => `
        <button class="avatar-opt ${id===curAv?'sel':''}" data-avatar="${id}" title="${id==='none'?t('no_pic'):''}">
          ${id==='none' ? '<span>'+formatCode(myCode).slice(0,2)+'</span>' : avatarArt(id)}
        </button>`).join('')}
    </div>
    <div class="my-code-label" style="margin-bottom:8px;">${t('language')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;">
      ${[['de','Deutsch'],['en','English']].map(([code,label]) => `
        <button class="btn-ghost dl-lang" data-lang="${code}" style="padding:11px;${code===currentLang?'border-color:var(--accent);color:var(--text);':''}">${label}</button>`).join('')}
    </div>
    <div class="my-code-label" style="margin-bottom:8px;">${t('design')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      ${Object.entries(THEMES).map(([key,th]) => `
        <button class="dl-theme" data-theme="${key}" style="padding:11px;border:1px solid ${key===curTheme?'var(--accent)':'var(--line)'};border-radius:10px;background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;">
          <span style="width:12px;height:12px;border-radius:50%;background:${th.vars['--accent']};"></span>
          <span style="font-size:13px;">${th.name[currentLang]||th.name.de}</span>
        </button>`).join('')}
    </div>
    <div class="modal-actions"><button class="btn-primary" id="dl-close">${t('close')}</button></div>
  `);
  document.querySelectorAll('.avatar-opt').forEach(b => b.addEventListener('click', () => {
    setMyAvatar(b.dataset.avatar);
    // Kontakten das neue Bild direkt mitteilen (über den verschlüsselten Kanal).
    broadcastAvatar();
    openDesignModal();
  }));
  document.querySelectorAll('.dl-theme').forEach(b => b.addEventListener('click', () => { applyTheme(b.dataset.theme); openDesignModal(); }));
  document.querySelectorAll('.dl-lang').forEach(b => b.addEventListener('click', () => {
    currentLang = b.dataset.lang; localStorage.setItem('chiffre_lang', currentLang);
    closeModal(); renderShell();
  }));
  document.getElementById('dl-close').addEventListener('click', closeModal);
}

// Neues Profilbild an alle verbundenen Kontakte schicken.
function broadcastAvatar(){
  const av = getMyAvatar();
  Object.keys(connections).forEach(async code => {
    const conn = connections[code];
    if (conn && conn.open && sharedKeys[code]){
      const packet = await encryptPayload(code, { kind:'avatar', avatar: av });
      if (packet) conn.send(packet);
    }
  });
}

applyTheme(localStorage.getItem('chiffre_theme') || 'midnight');
purgeOldMessages();
setInterval(purgeOldMessages, 60000);

ensureKeyPair().then(() => {
  if (localStorage.getItem('chiffre_onboarded') === '1'){
    initPeer();
    renderShell();
  } else {
    renderWelcome();
  }
});
